server:
  port: 8081

logging:
  file:
    name: logs/toy-store.log

spring:
  application:
    name: toy-store-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/course-realm

      client:
        registration:
          keycloak:
            client-id: backend-app
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid, profile
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/course-realm

  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

  datasource:
    url: jdbc:mariadb://localhost:3307/toy_store
    username: appuser
    password: appuser
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml

toy-store:
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 8
    thread-name-prefix: toy-store-async-
    simulated-delay-millis: 500
    result-timeout-millis: 2000
