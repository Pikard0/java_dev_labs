services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - toy-store-rabbitmq-data:/var/lib/rabbitmq

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: toy_store
      MARIADB_USER: appuser
      MARIADB_PASSWORD: appuser
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - toy-store-data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/course-realm.json:/opt/keycloak/data/import/course-realm.json:ro

  order-service:
    build:
      context: ./order-service
    environment:
      TOY_STORE_RABBITMQ_HOST: rabbitmq
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/toy_store
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/course-realm
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/course-realm
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    depends_on:
      - rabbitmq
      - mariadb
      - keycloak
    ports:
      - "8081:8081"

  catalog-service:
    build:
      context: ./catalog-service
    environment:
      TOY_STORE_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    ports:
      - "8082:8082"

volumes:
  toy-store-data:
  toy-store-rabbitmq-data:
