services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: taxi_order_service
      MARIADB_USER: appuser
      MARIADB_PASSWORD: appuser
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/course-realm.json:/opt/keycloak/data/import/course-realm.json:ro

volumes:
  mariadb-data:
